<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ウェルカムボード生成</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+JP:wght@700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#1e293b; color:#e2e8f0; font-family:'Noto Sans JP',sans-serif; min-height:100vh; padding:24px; }
  h1 { font-size:20px; font-weight:900; color:#fff; margin-bottom:4px; }
  .sub-title { font-size:11px; color:#64748b; letter-spacing:2px; margin-bottom:20px; }
  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .date-input { background:#0f172a; border:1px solid #334155; color:#e2e8f0; padding:10px 16px; border-radius:8px; font-size:14px; font-family:inherit; }
  .btn { padding:10px 20px; border-radius:8px; border:none; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:all .15s; }
  .btn-primary { background:#f43f5e; color:#fff; }
  .btn-print { background:#10b981; color:#fff; }
  .btn-secondary { background:#334155; color:#e2e8f0; }
  .status { font-size:12px; color:#64748b; padding:8px 0; }
  .status.ok { color:#10b981; } .status.err { color:#f43f5e; }
  .preview-area { display:flex; gap:40px; flex-wrap:wrap; margin-top:16px; }
  .preview-wrap { flex:0 0 auto; }
  .preview-label { font-size:11px; color:#64748b; letter-spacing:2px; margin-bottom:8px; font-weight:700; }
  .board-page {
    width:297mm; min-height:420mm;
    font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
    border-radius:12px; box-shadow:0 20px 80px rgba(0,0,0,.8);
    overflow:hidden; position:relative;
    transform-origin:top left; transform:scale(0.42);
    margin-bottom:calc((420mm * 0.42) - 420mm);
    display:flex; flex-direction:column;
  }
  @media print {
    body { background:#fff; padding:0; }
    .controls,.sub-title,h1,.status,.preview-label,.no-print { display:none !important; }
    .preview-area { display:block; }
    .preview-wrap { page-break-after:always; }
    .board-page { transform:none !important; margin:0 !important; box-shadow:none; border-radius:0; width:100%; min-height:auto; }
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
  }
</style>
</head>
<body>
<h1>🎉 Welcome Board Generator</h1>
<p class="sub-title">季節テーマ ウェルカムボード自動生成 / GARAGE SMB BOARD</p>
<div class="controls">
  <input type="date" id="targetDate" class="date-input">
  <button class="btn btn-primary" onclick="loadAndGenerate()">📋 データ取得・生成</button>
  <button class="btn btn-secondary no-print" onclick="setTomorrow()">📅 明日にセット</button>
  <button class="btn btn-print no-print" onclick="window.print()">🖨️ 印刷</button>
</div>
<div id="status" class="status">日付を選択してデータを取得してください</div>
<div class="preview-area" id="previewArea"></div>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDAyqKSD4oxh3PqZW1UIjuqL73Ejp33_E0",
  authDomain:"garage-armb-board.firebaseapp.com",
  databaseURL:"https://garage-armb-board-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"garage-armb-board",
  storageBucket:"garage-armb-board.firebasestorage.app",
  messagingSenderId:"430667841584",
  appId:"1:430667841584:web:81c17b57d4c6493875edf5"
});
const db = firebase.database();

function setTomorrow(){const t=new Date();t.setDate(t.getDate()+1);document.getElementById('targetDate').value=t.toISOString().slice(0,10);}
function getWorkType(t){if(!t)return'その他';if(t.includes('車検'))return'車検';if(t.includes('点検'))return'点検';if(t.includes('BP')||t.includes('板金')||t.includes('塗装'))return'BP';if(t.includes('整備')||t.includes('修理')||t.includes('交換'))return'整備';return'その他';}
function fmtTime(h){if(h==null)return'--:--';const hh=Math.floor(h),mm=Math.round((h-hh)*60);return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');}

const TYPE_COLORS={
  '車検': {bg:'#e91e63',text:'#fff'},
  '点検': {bg:'#1e88e5',text:'#fff'},
  '整備': {bg:'#43a047',text:'#fff'},
  'BP':   {bg:'#8e24aa',text:'#fff'},
  'その他':{bg:'#fb8c00',text:'#fff'},
};

const THEMES={
  1:{
    pageBg:'linear-gradient(180deg,#e3f2fd 0%,#ffffff 50%)',
    headerBg:'linear-gradient(135deg,#1565c0,#1e88e5,#42a5f5)',
    borderColor:'#42a5f5',rowEvenBg:'#e3f2fd',rowOddBg:'#ffffff',dividerColor:'#90caf9',
    footerBg:'#1565c0',footerText:'#fff',periodBg:'#ffd600',periodText:'#1565c0',
    emoji:'🎍',
    deco:()=>`<svg style="position:absolute;bottom:0;right:0;opacity:0.15;pointer-events:none" width="160" height="110" viewBox="0 0 160 110">
      <circle cx="125" cy="28" r="24" fill="#ffd600"/>
      ${Array.from({length:12},(_,i)=>{const a=i*30*Math.PI/180;return`<line x1="${125+28*Math.cos(a)}" y1="${28+28*Math.sin(a)}" x2="${125+38*Math.cos(a)}" y2="${28+38*Math.sin(a)}" stroke="#ffd600" stroke-width="3"/>`}).join('')}
      <polygon points="20,110 65,38 110,110" fill="white" stroke="#42a5f5" stroke-width="2"/>
      <polygon points="38,110 65,58 92,110" fill="#e3f2fd"/>
      <rect x="0" y="96" width="160" height="14" fill="#c8e6c9"/>
    </svg>
    <div style="position:absolute;top:6mm;right:10mm;font-size:48pt;opacity:0.18;line-height:1">🎋</div>`,
  },
  3:{
    pageBg:'linear-gradient(180deg,#fce4ec 0%,#fff9fb 50%)',
    headerBg:'linear-gradient(135deg,#c2185b,#e91e63,#f48fb1)',
    borderColor:'#f48fb1',rowEvenBg:'#fce4ec',rowOddBg:'#fff9fb',dividerColor:'#f8bbd0',
    footerBg:'#c2185b',footerText:'#fff',periodBg:'#fff176',periodText:'#880e4f',
    emoji:'🌸',
    deco:()=>{const p=Array.from({length:22},(_,i)=>{const x=(i*43+8)%268,y=(i*19+4)%82,s=7+i%9,r=i*17;return`<g transform="translate(${x},${y}) rotate(${r})"><ellipse cx="0" cy="-${s*.6}" rx="${s*.32}" ry="${s*.6}" fill="rgba(255,255,255,0.55)"/><ellipse cx="${s*.52}" cy="-${s*.18}" rx="${s*.32}" ry="${s*.6}" fill="rgba(255,255,255,0.45)" transform="rotate(72)"/><ellipse cx="${s*.32}" cy="${s*.48}" rx="${s*.32}" ry="${s*.6}" fill="rgba(255,255,255,0.45)" transform="rotate(144)"/><ellipse cx="-${s*.32}" cy="${s*.48}" rx="${s*.32}" ry="${s*.6}" fill="rgba(255,255,255,0.45)" transform="rotate(216)"/><ellipse cx="-${s*.52}" cy="-${s*.18}" rx="${s*.32}" ry="${s*.6}" fill="rgba(255,255,255,0.45)" transform="rotate(288)"/></g>`;}).join('');return`<svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 297 110" preserveAspectRatio="xMidYMid slice">${p}</svg><div style="position:absolute;top:5mm;right:9mm;font-size:50pt;opacity:0.2;line-height:1">🌸</div>`;}
  },
  5:{
    pageBg:'linear-gradient(180deg,#e8f5e9 0%,#f9fbe7 50%)',
    headerBg:'linear-gradient(135deg,#2e7d32,#388e3c,#66bb6a)',
    borderColor:'#81c784',rowEvenBg:'#e8f5e9',rowOddBg:'#f9fbe7',dividerColor:'#a5d6a7',
    footerBg:'#2e7d32',footerText:'#fff',periodBg:'#fff176',periodText:'#1b5e20',
    emoji:'🌿',
    deco:()=>{const l=Array.from({length:14},(_,i)=>{const x=(i*20+4)%272,y=(i*15+3)%82;return`<g transform="translate(${x},${y}) rotate(${i*23})"><path d="M0,-14 C5,-9 9,-3 0,0 C-9,-3 -5,-9 0,-14Z" fill="rgba(255,255,255,0.5)"/><line x1="0" y1="0" x2="0" y2="9" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/></g>`;}).join('');return`<svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 297 110" preserveAspectRatio="xMidYMid slice">${l}</svg><div style="position:absolute;top:5mm;right:9mm;font-size:50pt;opacity:0.2;line-height:1">🍃</div>`;}
  },
  7:{
    pageBg:'linear-gradient(180deg,#e0f7fa 0%,#ffffff 50%)',
    headerBg:'linear-gradient(135deg,#0277bd,#0288d1,#29b6f6)',
    borderColor:'#4dd0e1',rowEvenBg:'#e0f7fa',rowOddBg:'#ffffff',dividerColor:'#80deea',
    footerBg:'#0277bd',footerText:'#fff',periodBg:'#fff176',periodText:'#01579b',
    emoji:'☀️',
    deco:()=>`<svg style="position:absolute;bottom:0;left:0;right:0;pointer-events:none" viewBox="0 0 297 28" preserveAspectRatio="none" height="28">
      <path d="M0,10 Q37,0 74,10 Q111,20 148,10 Q185,0 222,10 Q259,20 297,10 L297,28 L0,28Z" fill="rgba(255,255,255,0.3)"/>
      <path d="M0,16 Q50,5 100,16 Q150,27 200,16 Q250,5 297,16 L297,28 L0,28Z" fill="rgba(255,255,255,0.2)"/>
    </svg>
    <svg style="position:absolute;right:8mm;top:3mm;opacity:0.18;pointer-events:none" width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="20" fill="#ffd600"/>
      ${Array.from({length:12},(_,i)=>{const a=i*30*Math.PI/180;return`<line x1="${36+24*Math.cos(a)}" y1="${36+24*Math.sin(a)}" x2="${36+33*Math.cos(a)}" y2="${36+33*Math.sin(a)}" stroke="#ffd600" stroke-width="3.5" stroke-linecap="round"/>`}).join('')}
    </svg>
    <div style="position:absolute;top:8mm;left:12mm;font-size:34pt;opacity:0.18;line-height:1">🏖️</div>`,
  },
  9:{
    pageBg:'linear-gradient(180deg,#fff3e0 0%,#fffde7 50%)',
    headerBg:'linear-gradient(135deg,#e65100,#ef6c00,#ffa726)',
    borderColor:'#ffb74d',rowEvenBg:'#fff3e0',rowOddBg:'#fffde7',dividerColor:'#ffcc80',
    footerBg:'#e65100',footerText:'#fff',periodBg:'#fff176',periodText:'#bf360c',
    emoji:'🍁',
    deco:()=>{const l=Array.from({length:18},(_,i)=>{const x=(i*16+5)%268,y=(i*12+3)%82,s=9+i%9;const c=i%3===0?'rgba(239,83,80,0.55)':i%3===1?'rgba(255,152,0,0.55)':'rgba(255,213,79,0.55)';return`<g transform="translate(${x+s/2},${y+s/2}) rotate(${i*20})"><path d="M0,-${s} L${s*.4},-${s*.3} L${s},-${s*.3} L${s*.5},${s*.2} L${s*.7},${s} L0,${s*.5} L-${s*.7},${s} L-${s*.5},${s*.2} L-${s},-${s*.3} L-${s*.4},-${s*.3}Z" fill="${c}"/></g>`;}).join('');return`<svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 297 110" preserveAspectRatio="xMidYMid slice">${l}</svg><div style="position:absolute;top:5mm;right:9mm;font-size:50pt;opacity:0.2;line-height:1">🍂</div>`;}
  },
  12:{
    pageBg:'linear-gradient(180deg,#e8eaf6 0%,#ffffff 50%)',
    headerBg:'linear-gradient(135deg,#b71c1c,#c62828,#ef5350)',
    borderColor:'#ef9a9a',rowEvenBg:'#e8eaf6',rowOddBg:'#ffffff',dividerColor:'#9fa8da',
    footerBg:'#b71c1c',footerText:'#fff',periodBg:'#fff176',periodText:'#7f0000',
    emoji:'🎄',
    deco:()=>{const s=Array.from({length:22},(_,i)=>{const x=(i*14+3)%278,y=(i*11+4)%86;return`<circle cx="${x}" cy="${y}" r="${1+i%2}" fill="${i%3===0?'#ffd600':'rgba(255,255,255,0.8)'}" opacity="${0.4+0.5*(i%3)/3}"/>`;}).join('');return`<svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 297 110" preserveAspectRatio="xMidYMid slice">${s}</svg>
    <svg style="position:absolute;right:9mm;top:2mm;opacity:0.2;pointer-events:none" width="65" height="88" viewBox="0 0 65 88">
      <polygon points="32,4 43,28 65,28 47,44 54,68 32,54 10,68 17,44 0,28 22,28" fill="#ffd600"/>
      <rect x="25" y="68" width="15" height="18" fill="#8d6e63"/>
    </svg>
    <div style="position:absolute;top:5mm;left:11mm;font-size:34pt;opacity:0.18;line-height:1">⛄</div>`;}
  },
};

function getThemeKey(m){if(m<=2)return 1;if(m<=4)return 3;if(m<=6)return 5;if(m<=8)return 7;if(m<=11)return 9;return 12;}

function buildPage(pageJobs,period,dateStr,pageIdx,totalPages,month){
  const isAm=period==='am';
  const th=THEMES[getThemeKey(month)];

  const page=document.createElement('div');
  page.className='board-page';
  page.style.cssText=`background:${th.pageBg};`;

  // ヘッダー
  const hdr=document.createElement('div');
  hdr.style.cssText=`background:${th.headerBg};position:relative;overflow:hidden;padding:10mm 14mm 8mm;min-height:55mm;flex-shrink:0;`;
  hdr.innerHTML=`
    ${th.deco()}
    <div style="position:relative;z-index:2">
      <div style="font-family:'Zen Maru Gothic',sans-serif;font-size:58pt;font-weight:900;color:rgba(255,255,255,0.2);letter-spacing:4px;line-height:0.88;margin-bottom:3mm">welcome</div>
      <div style="font-family:'Zen Maru Gothic',sans-serif;font-size:21pt;font-weight:900;color:#fff;line-height:1.2;margin-bottom:4mm;text-shadow:0 2px 8px rgba(0,0,0,0.25)">${dateStr}</div>
      <span style="display:inline-block;background:${th.periodBg};color:${th.periodText};font-size:13pt;font-weight:900;padding:2mm 9mm;border-radius:30px;letter-spacing:2px">${isAm?'午前の部':'午後の部'}</span>
    </div>`;
  page.appendChild(hdr);

  // テーブルヘッダー
  const thead=document.createElement('div');
  thead.style.cssText=`display:grid;grid-template-columns:1fr 46mm 42mm;padding:3mm 12mm 2.5mm;border-bottom:3px solid ${th.borderColor};background:${th.rowEvenBg};flex-shrink:0;`;
  thead.innerHTML=`
    <div style="font-size:11pt;font-weight:900;color:#546e7a;letter-spacing:3px">お　名　前</div>
    <div style="font-size:11pt;font-weight:900;color:#546e7a;letter-spacing:2px;text-align:center">作業内容</div>
    <div style="font-size:11pt;font-weight:900;color:#546e7a;letter-spacing:2px;text-align:center">ご来店時間</div>`;
  page.appendChild(thead);

  // 行
  const list=document.createElement('div');
  list.style.cssText='flex:1;';
  if(pageJobs.length===0){
    list.style.cssText='flex:1;text-align:center;padding:20mm;font-size:14pt;color:#90a4ae;';
    list.textContent='本日の予定はありません';
  } else {
    pageJobs.forEach((job,idx)=>{
      const wtype=getWorkType(job.type);
      const tc=TYPE_COLORS[wtype]||TYPE_COLORS['その他'];
      const row=document.createElement('div');
      row.style.cssText=`display:grid;grid-template-columns:1fr 46mm 42mm;padding:3.8mm 12mm;background:${idx%2===0?th.rowEvenBg:th.rowOddBg};border-bottom:1.5px solid ${th.dividerColor};align-items:center;`;
      row.innerHTML=`
        <div style="font-family:'Zen Maru Gothic',sans-serif;font-size:25pt;font-weight:900;color:#212121;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
          ${job.owner||job.plate||'—'}<span style="font-size:13pt;font-weight:700;color:#78909c;margin-left:2mm"> 様</span>
          ${job._source==='bp'?`<span style="font-size:9pt;background:#f3e8ff;color:#9333ea;border:1px solid #d8b4fe;border-radius:6px;padding:1mm 3mm;margin-left:2mm;font-weight:700;vertical-align:middle">BP</span>`:''}
        </div>
        <div style="text-align:center;">
          <span style="display:inline-block;background:${tc.bg};color:${tc.text};font-size:14pt;font-weight:900;padding:1.5mm 4mm;border-radius:10px;letter-spacing:1px;min-width:34mm;text-align:center;">${wtype}</span>
        </div>
        <div style="text-align:center;font-family:'Montserrat',sans-serif;font-size:27pt;font-weight:900;color:#212121;">${fmtTime(job.start)}</div>`;
      list.appendChild(row);
    });
  }
  page.appendChild(list);

  // フッター
  const ftr=document.createElement('div');
  ftr.style.cssText=`background:${th.footerBg};padding:5mm 14mm;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;`;
  ftr.innerHTML=`
    <div style="font-family:'Zen Maru Gothic',sans-serif;font-size:13pt;font-weight:900;color:${th.footerText};letter-spacing:2px;">ご来店ありがとうございます ${th.emoji}</div>
    <div style="font-size:9pt;color:rgba(255,255,255,0.55);letter-spacing:2px;">${totalPages>1?`(${pageIdx+1}/${totalPages}) `:''}GARAGE SMB BOARD</div>`;
  page.appendChild(ftr);

  return page;
}

function loadAndGenerate(){
  const date=document.getElementById('targetDate').value;
  if(!date){document.getElementById('status').textContent='日付を選択してください';document.getElementById('status').className='status err';return;}
  document.getElementById('status').textContent='Firebaseからデータ取得中...';
  document.getElementById('status').className='status';

  Promise.all([
    db.ref('garage/garage_jobs').once('value'),
    db.ref('garage/bp_jobs').once('value')
  ]).then(([jobsSnap,bpSnap])=>{
    const allJobsRaw=jobsSnap.val();
    if(!allJobsRaw||!Array.isArray(allJobsRaw)){document.getElementById('status').textContent='データが見つかりません';document.getElementById('status').className='status err';return;}

    const regularJobs=allJobsRaw.filter(j=>j&&!j.completed&&(j.date===date||j.displayDate===date)).map(j=>({...j,_source:'board'}));
    const bpRaw=bpSnap.val();
    const bpArr=bpRaw?(Array.isArray(bpRaw)?bpRaw:Object.values(bpRaw)):[];
    const bpJobs=bpArr.filter(j=>j&&j.inDate===date&&!j.confirmed).map(j=>{
      let s=null;
      if(j.inTime){const p=j.inTime.split(':');s=parseInt(p[0])+(parseInt(p[1]||0)/60);}
      else if(j.inAmPm==='AM')s=9;else if(j.inAmPm==='PM')s=13;
      return{_source:'bp',owner:j.owner||j.plate||'—',plate:j.plate||'',type:j.type||'BP板金',start:s,date:date};
    });

    const jobs=[...regularJobs,...bpJobs].sort((a,b)=>(a.start??99)-(b.start??99));
    const amJobs=jobs.filter(j=>j.start==null||j.start<12);
    const pmJobs=jobs.filter(j=>j.start!=null&&j.start>=12);

    document.getElementById('status').textContent=`✅ ${date} — 午前 ${amJobs.length}件 / 午後 ${pmJobs.length}件（BP ${bpJobs.length}件含む）`;
    document.getElementById('status').className='status ok';

    const d=new Date(date+'T00:00:00');
    const month=d.getMonth()+1;
    const wdays=['日','月','火','水','木','金','土'];
    const dateStr=`${d.getFullYear()}年${month}月${d.getDate()}日（${wdays[d.getDay()]}）`;

    const area=document.getElementById('previewArea');
    area.innerHTML='';

    [['am',amJobs],['pm',pmJobs]].forEach(([period,pJobs])=>{
      const pages=[];
      for(let i=0;i<Math.max(1,Math.ceil(pJobs.length/12));i++)pages.push(pJobs.slice(i*12,(i+1)*12));
      pages.forEach((pageJobs,pageIdx)=>{
        const wrap=document.createElement('div');wrap.className='preview-wrap';
        const label=document.createElement('div');label.className='preview-label no-print';
        label.textContent=`${period==='am'?'午前':'午後'}${pages.length>1?` (${pageIdx+1}/${pages.length})`:''} — A3縦`;
        wrap.appendChild(label);
        wrap.appendChild(buildPage(pageJobs,period,dateStr,pageIdx,pages.length,month));
        area.appendChild(wrap);
      });
    });
  }).catch(err=>{document.getElementById('status').textContent='データ取得エラー: '+err.message;document.getElementById('status').className='status err';});
}

setTomorrow();
</script>
</body>
</html>
