<style>

  h1 { font-family:'Montserrat',sans-serif; font-size:22px; font-weight:900; letter-spacing:3px; background:linear-gradient(90deg,#f43f5e,#8b5cf6,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; }
  .sub-title { font-size:12px; color:var(--sub); letter-spacing:2px; margin-bottom:20px; }
  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .date-input { background:var(--card); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:8px; font-size:14px; font-family:inherit; }
  .btn { padding:10px 20px; border-radius:8px; border:none; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:all .15s; letter-spacing:1px; }
  .btn-primary { background:linear-gradient(135deg,#f43f5e,#8b5cf6); color:#fff; }
  .btn-primary:hover { opacity:.85; transform:translateY(-1px); }
  .btn-print { background:linear-gradient(135deg,#06b6d4,#10b981); color:#fff; }
  .btn-secondary { background:var(--card); border:1px solid var(--border); color:var(--text); }
  .btn-secondary:hover { border-color:#06b6d4; color:#06b6d4; }
  .status { font-size:12px; color:var(--sub); padding:8px 0; }
  .status.ok { color:#10b981; } .status.err { color:#f43f5e; }
  .preview-area { display:flex; gap:40px; flex-wrap:wrap; margin-top:16px; }
  .preview-wrap { flex:0 0 auto; }
  .preview-label { font-size:11px; color:var(--sub); letter-spacing:2px; margin-bottom:8px; font-weight:700; }

  /* A3縦ボード本体 */
  .board-page {
    width:297mm; min-height:420mm; color:#0f172a;
    font-family:'Zen Kaku Gothic New',sans-serif;
    border-radius:6px; box-shadow:0 20px 80px rgba(0,0,0,.8);
    overflow:hidden; position:relative;
    transform-origin:top left; transform:scale(0.42);
    margin-bottom:calc((420mm * 0.42) - 420mm);
  }

  .type-badge { display:inline-block; padding:2.5mm 7mm; border-radius:20px; font-size:14pt; font-weight:900; letter-spacing:1px; white-space:nowrap; }
  .type-車検  { background:linear-gradient(135deg,#fef2f2,#fee2e2); color:#dc2626; border:1.5px solid #fca5a5; }
  .type-点検  { background:linear-gradient(135deg,#eff6ff,#dbeafe); color:#2563eb; border:1.5px solid #93c5fd; }
  .type-整備  { background:linear-gradient(135deg,#f0fdf4,#dcfce7); color:#16a34a; border:1.5px solid #86efac; }
  .type-BP    { background:linear-gradient(135deg,#fdf4ff,#f3e8ff); color:#9333ea; border:1.5px solid #d8b4fe; }
  .type-その他{ background:linear-gradient(135deg,#fffbeb,#fef3c7); color:#d97706; border:1.5px solid #fcd34d; }

  @media print {
    body { background:#fff; padding:0; }
    .controls,.sub-title,h1,.status,.preview-label,.no-print { display:none !important; }
    .preview-area { display:block; }
    .preview-wrap { page-break-after:always; }
    .board-page { transform:none !important; margin:0 !important; box-shadow:none; border-radius:0; width:100%; min-height:auto; }

          </div>
      </div>
    </div>
    <div style="height:5px;background:linear-gradient(90deg,#4ade80,#86efac,#fef08a,#4ade80)"></div>`,
  rowStyle: (idx) => idx%2===0 ? 'background:linear-gradient(90deg,rgba(74,222,128,0.07),transparent)' : '',
  rowDeco: () => `<svg style="position:absolute;right:2mm;top:50%;transform:translateY(-50%);opacity:0.08" width="30" height="30" viewBox="0 0 30 30"><path d="M15,2 C20,2 28,10 28,18 C28,24 22,28 15,28 C8,28 2,24 2,18 C2,10 10,2 15,2Z" fill="#16a34a"/><line x1="15" y1="28" x2="15" y2="10" stroke="#14532d" stroke-width="1.5"/><line x1="15" y1="20" x2="8" y2="14" stroke="#14532d" stroke-width="1.2"/><line x1="15" y1="17" x2="22" y2="11" stroke="#14532d" stroke-width="1.2"/></svg>`,
};

function buildPage(pageJobs, period, dateStr, pageIdx, totalPages, month) {
  const isAm = period==='am';
  const key = getThemeKey(month);
  const theme = THEMES[key];

  const page = document.createElement('div');
  page.className = 'board-page';
  page.style.background = theme.bg;

  const header = document.createElement('div');
  header.innerHTML = theme.headerHTML(dateStr, isAm?'午前の部':'午後の部', pageJobs.length);
  page.appendChild(header);

  const body = document.createElement('div');
  body.style.cssText = `background:${theme.bodyBg};padding:6mm 12mm 8mm;`;

  const table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;';

  const thead = document.createElement('thead');
  thead.innerHTML = `<tr style="border-bottom:2px solid rgba(0,0,0,0.1)">
    <th style="padding:2.5mm 4mm;font-size:8pt;font-weight:700;letter-spacing:2px;color:#94a3b8;text-align:left;width:32mm"></th>
    <th style="padding:2.5mm 4mm;font-size:8pt;font-weight:700;letter-spacing:2px;color:#94a3b8;text-align:left"></th>
    <th style="padding:2.5mm 4mm;font-size:8pt;font-weight:700;letter-spacing:2px;color:#94a3b8;text-align:left;width:36mm">作業内容</th>
  </tr>`;
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  if(pageJobs.length===0){
    tbody.innerHTML=`<tr><td colspan="3" style="text-align:center;padding:16mm;color:#94a3b8;font-size:14pt">本日の予定はありません</td></tr>`;
  } else {
    pageJobs.forEach((job,idx)=>{
      const wtype=getWorkType(job.type);
      const rowBg=theme.rowStyle(idx);
      const tr=document.createElement('tr');
      tr.style.cssText=`border-bottom:1px solid rgba(0,0,0,0.06);position:relative;${rowBg}`;
      const bpBadge = job._source==='bp'
        ? `<span style="font-size:9pt;background:#f3e8ff;color:#9333ea;border:1px solid #d8b4fe;border-radius:6px;padding:1mm 3mm;margin-left:3mm;font-weight:700">BP</span>`
        : '';
      tr.innerHTML=`
        <td style="padding:3.5mm 4mm;white-space:nowrap"><div style="display:flex;align-items:baseline;gap:3mm"><span style="font-size:14pt;font-weight:700;color:#475569;letter-spacing:1px">ご来店時間：</span><span style="font-family:'Montserrat',sans-serif;font-size:26pt;font-weight:900;color:#0f172a;line-height:1">${fmtTime(job.start)}</span></div></td>
        <td style="padding:3mm 4mm;position:relative;width:99%;text-align:center">
          <div style="font-family:'Noto Serif JP',serif;font-size:28pt;font-weight:700;color:#0f172a;line-height:1.2;display:inline-flex;align-items:baseline;gap:4mm">
            <span style="font-size:28pt;font-weight:700;color:#475569;letter-spacing:2px">お客様名：</span><span>${cleanName(job.owner)||cleanName(job.plate)||'—'}</span>&nbsp;<span style="font-size:18pt;color:#94a3b8;font-weight:400">様</span>${bpBadge}
          </div>
          ${theme.rowDeco()}
        </td>
        <td style="padding:3.5mm 4mm"><span class="type-badge type-${wtype}">${wtype}</span></td>
      `;
      tbody.appendChild(tr);

      if((idx+1)%5===0&&idx+1<pageJobs.length){
        const dr=document.createElement('tr');
        dr.innerHTML=`<td colspan="3" style="padding:1.5mm 0"><div style="height:2px;background:linear-gradient(90deg,rgba(0,0,0,0.08),rgba(0,0,0,0.04),transparent);border-radius:2px"></div></td>`;
        tbody.appendChild(dr);
      }
    });
  }

  table.appendChild(tbody);
  body.appendChild(table);
  page.appendChild(body);

  const footer=document.createElement('div');
  footer.style.cssText=`margin:0 12mm;padding:4mm 0;border-top:1px solid rgba(0,0,0,0.08);display:flex;justify-content:space-between;align-items:center;background:${theme.bodyBg}`;
  footer.innerHTML=`
    <div style="font-size:9pt;color:#94a3b8;letter-spacing:2px">本日もご来店ありがとうございます${totalPages>1?` (${pageIdx+1}/${totalPages})`:''}</div>
    <div style="font-family:'Montserrat',sans-serif;font-size:9pt;font-weight:900;letter-spacing:3px;color:#cbd5e1">GARAGE SMB BOARD</div>
  `;
  page.appendChild(footer);
  return page;
}

function loadAndGenerate(){
  const date=document.getElementById('targetDate').value;
  if(!date){document.getElementById('status').textContent='日付を選択してください';document.getElementById('status').className='status err';return;}
  document.getElementById('status').textContent='Firebaseからデータ取得中...';
  document.getElementById('status').className='status';

  Promise.all([
    db.ref('garage/garage_jobs').once('value'),
    db.ref('garage/bp_jobs').once('value')
  ]).then(([jobsSnap, bpSnap]) => {
    const allJobsRaw = jobsSnap.val();
    if(!allJobsRaw||!Array.isArray(allJobsRaw)){
      document.getElementById('status').textContent='データが見つかりません';
      document.getElementById('status').className='status err';
      return;
    }

    const regularJobs = allJobsRaw
      .filter(j=>j&&!j.completed&&(j.date===date||j.displayDate===date))
      .map(j=>({...j, _source:'board'}));

    const bpRaw = bpSnap.val();
    const bpArr = bpRaw
      ? (Array.isArray(bpRaw) ? bpRaw : Object.values(bpRaw))
      : [];
    const bpJobs = bpArr
      .filter(j=>j&&j.inDate===date&&!j.confirmed)
      .map(j=>{
        let startNum = null;
        if(j.inTime){
          const pts = j.inTime.split(':');
          startNum = parseInt(pts[0]) + (parseInt(pts[1]||0)/60);
        } else if(j.inAmPm==='AM'){
          startNum = 9;
        } else if(j.inAmPm==='PM'){
          startNum = 13;
        }
        return {
          _source: 'bp',
          owner: j.owner || j.plate || '—',
          plate: j.plate || '',
          type: j.type || 'BP板金',
          start: startNum,
          date: date
        };
      });

    const jobs = [...regularJobs, ...bpJobs].sort((a,b)=>{
      const as = a.start != null ? a.start : 99;
      const bs = b.start != null ? b.start : 99;
      return as - bs;
    });

    const amJobs=jobs.filter(j=>j.start==null||j.start<12);
    const pmJobs=jobs.filter(j=>j.start!=null&&j.start>=12);

    document.getElementById('status').textContent=
      `✅ ${date} — 午前 ${amJobs.length}件 / 午後 ${pmJobs.length}件（BP ${bpJobs.length}件含む）`;
    document.getElementById('status').className='status ok';

    const d=new Date(date+'T00:00:00');
    const month=d.getMonth()+1;
    const wdays=['日','月','火','水','木','金','土'];
    const dateStr=`${d.getFullYear()}年${month}月${d.getDate()}日（${wdays[d.getDay()]}）`;

    const area=document.getElementById('previewArea');
    area.innerHTML='';

    const seasonNames={1:'冬',3:'春',5:'新緑',7:'夏',9:'秋',12:'冬'};
    const key=getThemeKey(month);

    [['am',amJobs],['pm',pmJobs]].forEach(([period,pJobs])=>{
      const pages=[];
      for(let i=0;i<Math.max(1,Math.ceil(pJobs.length/15));i++) pages.push(pJobs.slice(i*15,(i+1)*15));
      pages.forEach((pageJobs,pageIdx)=>{
        const wrap=document.createElement('div');
        wrap.className='preview-wrap';
        const label=document.createElement('div');
        label.className='preview-label no-print';
        label.textContent=`${period==='am'?'午前':'午後'} ${seasonNames[key]||'季節'}テーマ${pages.length>1?` (${pageIdx+1}/${pages.length})`:''} — A3縦`;
        wrap.appendChild(label);
        wrap.appendChild(buildPage(pageJobs,period,dateStr,pageIdx,pages.length,month));
        area.appendChild(wrap);
      });
    });
  }).catch(err=>{
    document.getElementById('status').textContent='データ取得エラー: '+err.message;
    document.getElementById('status').className='status err';
  });
}

setTomorrow();
</script>
